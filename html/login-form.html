<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="../css/login-form.css">
</head>
<body>
    <div class="parent">
        <img src="" alt="">
        <form action="" class="form">
            <label for="" style="font-size: 30px;">Login</label><br><br>
            <input type="email" placeholder="Email" style="width: 250px;background-color: rgba(0, 0, 0, 0.098);"><br><br>
            <input type="password" placeholder="Password" style="width: 250px;background-color: rgba(0, 0, 0, 0.098);"><br><br>
            <input type="submit" value="SIGN IN" style="background-color: rgba(29, 236, 18, 0.87);border-radius: 5px;border: none;"><br>
            <p style="font-size: 12px;">Forgot <span style="color: blue;"> Username / Password?</span> <br> Don't have an account? <span style="color: blue;">Sign up </span></p>
        </form>
        
    </div>
</body>
</html>
